name: Build Busy Duck Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: windows
            os: windows-latest
            archive: busy-duck-windows.zip
            output: dist/busy_duck
          - name: linux
            os: ubuntu-22.04
            archive: busy-duck-linux.tar.gz
            output: dist/busy_duck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/busy_duck -DestinationPath dist/${{ matrix.archive }}

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar -czf dist/${{ matrix.archive }} -C dist busy_duck

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: busy-duck-${{ matrix.name }}
          path: dist/${{ matrix.archive }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*