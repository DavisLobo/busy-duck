[project]
name = "busy-duck"
version = "0.1.0"
description = "Local calendar aggregation app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.1",
  "PySide6>=6.6.0",
  "keyring>=25.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
busy-duck = "busy_duck.main:main"
busy-duck-cli = "busy_duck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
busy_duck = ["ui/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]