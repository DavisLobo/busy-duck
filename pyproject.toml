[project]
name = "busy-duck"
version = "0.1.0"
description = "Local calendar aggregation app"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "sqlalchemy>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.1",
  "PySide6>=6.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]